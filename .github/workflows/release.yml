name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Every signing input is a secret this repository does not have yet. Each step that needs one
# checks for it and fails with a named message rather than producing an unsigned artifact that
# looks releasable.
env:
  PROJECT: KVStudio.xcodeproj
  SCHEME: KVStudio
  APP_NAME: KV Studio

jobs:
  release:
    name: Build, sign, notarize
    runs-on: macos-15
    # Creating the release is the only write this workflow makes.
    permissions:
      contents: write
    steps:
      # Full history: the build number is derived from it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report toolchain
        run: xcodebuild -version

      - name: Require signing secrets
        run: |
          missing=""
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY \
                      NOTARY_APPLE_ID NOTARY_TEAM_ID NOTARY_PASSWORD SPARKLE_PRIVATE_KEY; do
            eval "value=\${$name}"
            [ -z "$value" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::release is not configured; missing secrets:$missing"
            exit 1
          fi
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      # The app ships both darwin backends so a single download works on either architecture.
      - name: Read the backend version this Studio bundles
        id: policy
        run: echo "bundled=$(python3 -c "import json;print(json.load(open('KVStudio/Resources/BackendPolicy.json'))['bundledBackend'])")" >> "$GITHUB_OUTPUT"

      - name: Fetch and verify both backend architectures
        run: |
          version="${{ steps.policy.outputs.bundled }}"
          base="https://github.com/Aybavs/go-kv-store/releases/download/v$version"
          mkdir -p "$RUNNER_TEMP/backend" && cd "$RUNNER_TEMP/backend"
          curl -fsSL -O "$base/SHA256SUMS"
          for arch in arm64 amd64; do curl -fsSL -O "$base/kv-server_v${version}_darwin_${arch}.tar.gz"; done
          # Verify before unpacking, the same order the app itself uses.
          grep darwin SHA256SUMS > darwin.sums
          shasum -a 256 -c darwin.sums
          for arch in arm64 amd64; do
            tar -xzf "kv-server_v${version}_darwin_${arch}.tar.gz" "kv-server_v${version}_darwin_${arch}/kv-server"
            mv "kv-server_v${version}_darwin_${arch}/kv-server" "kv-server-darwin-$arch"
          done

      - name: Build (Release)
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/KVStudio.xcarchive" \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" \
            CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" \
            CODE_SIGN_IDENTITY="${{ secrets.MACOS_SIGNING_IDENTITY }}" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime"

      - name: Sign nested executables, then the app
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          app="$RUNNER_TEMP/KVStudio.xcarchive/Products/Applications/$APP_NAME.app"
          # Nested code must be signed before the enclosing app, innermost first. Sparkle arrives
          # signed by its own team, and re-signing the framework wrapper leaves its helpers exactly
          # as they were; the notary service then rejects the build and names each one.
          for nested in \
            "$app/Contents/Frameworks/Sparkle.framework/Versions/"*/XPCServices/*.xpc \
            "$app/Contents/Frameworks/Sparkle.framework/Versions/"*/Updater.app \
            "$app/Contents/Frameworks/Sparkle.framework/Versions/"*/Autoupdate; do
            [ -e "$nested" ] || continue
            codesign --force --timestamp --options=runtime --sign "$IDENTITY" "$nested"
          done
          find "$app/Contents/Frameworks" -name "*.framework" -maxdepth 1 -print0 2>/dev/null |
            xargs -0 -I{} codesign --force --timestamp --options=runtime --sign "$IDENTITY" {}
          find "$app/Contents/Resources/backend" -type f -perm -u+x -print0 2>/dev/null |
            xargs -0 -I{} codesign --force --timestamp --options=runtime --sign "$IDENTITY" {}
          codesign --force --timestamp --options=runtime --sign "$IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Build DMG
        run: |
          app="$RUNNER_TEMP/KVStudio.xcarchive/Products/Applications/$APP_NAME.app"
          staging="$RUNNER_TEMP/dmg" && mkdir -p "$staging"
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "$APP_NAME" -srcfolder "$staging" -ov -format UDZO "$RUNNER_TEMP/KVStudio.dmg"
          codesign --force --timestamp --sign "${{ secrets.MACOS_SIGNING_IDENTITY }}" "$RUNNER_TEMP/KVStudio.dmg"

      - name: Notarize and staple
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          # A rejection arrives as a status, not a non-zero exit, and the reasons live in a log that
          # has to be asked for by submission id. Without this the run says only that stapling
          # failed, which is the symptom of the rejection rather than the rejection.
          xcrun notarytool submit "$RUNNER_TEMP/KVStudio.dmg" \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" \
            --wait | tee "$RUNNER_TEMP/notary.txt"

          submission=$(awk '/id: /{ print $2; exit }' "$RUNNER_TEMP/notary.txt")
          if ! grep -q "status: Accepted" "$RUNNER_TEMP/notary.txt"; then
            echo "::error::the notary service refused this build; its reasons follow"
            xcrun notarytool log "$submission" \
              --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" || true
            exit 1
          fi

          xcrun stapler staple "$RUNNER_TEMP/KVStudio.dmg"
          xcrun stapler validate "$RUNNER_TEMP/KVStudio.dmg"

      # A notarized, stapled DMG is what a machine that has never seen this developer will accept.
      - name: Verify the artifact the way a clean machine would
        run: |
          mount=$(hdiutil attach "$RUNNER_TEMP/KVStudio.dmg" -nobrowse -readonly | tail -1 | awk '{print $NF}')
          spctl --assess --type execute --verbose=4 "$mount/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "$mount/$APP_NAME.app"
          hdiutil detach "$mount"

      - name: Sign the Sparkle appcast entry
        id: sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          tool=$(find ~/Library/Developer/Xcode/DerivedData -name sign_update -type f 2>/dev/null | head -1)
          if [ -z "$tool" ]; then echo "::error::Sparkle's sign_update tool was not found in the resolved package"; exit 1; fi
          # sign_update prints the enclosure attributes ready to paste: edSignature and length.
          attributes=$(echo "$SPARKLE_PRIVATE_KEY" | "$tool" --ed-key-file - "$RUNNER_TEMP/KVStudio.dmg")
          echo "attributes=$attributes" >> "$GITHUB_OUTPUT"

      # Sparkle reads this, not the release page. Without it a signed DMG is still a download
      # nobody's copy of the app can find.
      - name: Write the appcast
        run: |
          version="${GITHUB_REF_NAME#v}"
          build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" \
            "$RUNNER_TEMP/KVStudio.xcarchive/Products/Applications/$APP_NAME.app/Contents/Info.plist")
          minimum=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" \
            "$RUNNER_TEMP/KVStudio.xcarchive/Products/Applications/$APP_NAME.app/Contents/Info.plist")
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/KVStudio.dmg"
          cat > "$RUNNER_TEMP/appcast.xml" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>KV Studio</title>
              <link>https://github.com/${GITHUB_REPOSITORY}</link>
              <description>Updates for KV Studio</description>
              <language>en</language>
              <item>
                <title>${version}</title>
                <pubDate>$(date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <sparkle:version>${build}</sparkle:version>
                <sparkle:shortVersionString>${version}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>${minimum}</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}</sparkle:releaseNotesLink>
                <enclosure url="${url}" type="application/octet-stream" ${{ steps.sign.outputs.attributes }} />
              </item>
            </channel>
          </rss>
          XML
          # The heredoc is indented for readability; the file must not be.
          sed -i '' 's/^          //' "$RUNNER_TEMP/appcast.xml"
          xmllint --noout "$RUNNER_TEMP/appcast.xml"

      - name: Checksums
        run: shasum -a 256 "$RUNNER_TEMP/KVStudio.dmg" | tee "$RUNNER_TEMP/SHA256SUMS"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "$RUNNER_TEMP/KVStudio.dmg" \
            "$RUNNER_TEMP/SHA256SUMS" \
            "$RUNNER_TEMP/appcast.xml"

      - uses: actions/upload-artifact@v4
        with:
          name: kv-studio-release
          path: |
            ${{ runner.temp }}/KVStudio.dmg
            ${{ runner.temp }}/SHA256SUMS
            ${{ runner.temp }}/appcast.xml
